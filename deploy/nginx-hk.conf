# 港服 Nginx 配置
# 作为入口服务器，反向代理到乌服
# 需要配置 SSL 证书

upstream lzti_backend {
    # 乌服的内网 IP 和端口
    server 10.0.0.1:3000;  # TODO: 替换为乌服实际内网 IP

    # 如果有多台乌服，可以添加更多
    # server 10.0.0.2:3000;
}

server {
    listen 80;
    server_name lzti.nzyy.cc;

    # 强制跳转到 HTTPS（生产环境建议开启）
    # return 301 https://$server_name$request_uri;

    # 如果只需要 HTTP，去掉上面的注释并删除下面的重定向
    location / {
        proxy_pass http://lzti_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存
    location /_next/static {
        proxy_pass http://lzti_backend;
        proxy_cache_valid 200 60m;
        expires 60m;
        add_header Cache-Control "public, immutable";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API 代理
    location /api {
        proxy_pass http://lzti_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location /health {
        proxy_pass http://lzti_backend/health;
        access_log off;
    }

    # 日志
    access_log /var/log/nginx/lzti_access.log;
    error_log /var/log/nginx/lzti_error.log;
}

